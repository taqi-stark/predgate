services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - predgate-data:/app/examples/credit-risk-demo/data
      - predgate-db:/app/db
      - mlflow-data:/mlflow
    environment:
      - DATABASE_URL=sqlite:////app/db/predgate.db
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    command: uvicorn predgate.api.main:app --host 0.0.0.0 --port 8000

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:8000

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    volumes:
      - predgate-data:/app/examples/credit-risk-demo/data
      - predgate-db:/app/db
      - mlflow-data:/mlflow
    environment:
      - API_URL=http://api:8000
      - DATABASE_URL=sqlite:////app/db/predgate.db
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - api
      - mlflow
    command: python scripts/seed.py

volumes:
  predgate-data:
  predgate-db:
  mlflow-data:
