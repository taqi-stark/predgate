[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "predgate"
version = "0.1.0a0"
description = "CI/CD quality gate for machine learning models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "PredGate Contributors" },
]
keywords = ["mlops", "ci-cd", "machine-learning", "quality-gate", "drift", "fairness", "model-evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pandera>=0.17.0",
    "mlflow>=2.8.0",
    "dvc>=3.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlmodel>=0.0.12",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "PyGithub>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.82.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
e2e = [
    "playwright>=1.40.0",
]

[project.urls]
Homepage = "https://github.com/taqi-stark/predgate"
Repository = "https://github.com/taqi-stark/predgate"
Issues = "https://github.com/taqi-stark/predgate/issues"

[project.scripts]
predgate = "predgate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/predgate"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/scripts",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/action.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=predgate --cov-report=term-missing"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008", "B904", "E501", "N803", "N806", "SIM105", "UP017"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
