name: 'PredGate Quality Gate'
description: 'Production CI/CD quality gate for ML models: data contracts, drift, leakage, label shift, slice regression, behavioral tests, latency/size budgets, and fairness.'
author: 'PredGate Authors'

inputs:
  config:
    description: 'Path to predgate.yaml configuration file'
    required: false
    default: 'predgate.yaml'
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  predgate-spec:
    description: 'Optional pinned PredGate package spec (e.g. predgate==0.1.0a0 or git+https://...@<sha>). When omitted on a PR, installs the committed base branch or pinned action ref (never the untrusted PR head).'
    required: false
    default: ''
  output-dir:
    description: 'Directory to store generated reports and PR comments'
    required: false
    default: 'predgate_output'
  baseline-dir:
    description: 'Directory containing persisted champion baseline (model.pkl, metadata.json, metrics.json)'
    required: false
    default: 'champion'
  base-ref:
    description: 'Base branch ref to load and pin the trusted champion baseline from on PRs'
    required: false
    default: ''
  pinned-sha256:
    description: 'Optional explicit pinned SHA-256 of champion/model.pkl (auto-read from base branch when omitted)'
    required: false
    default: ''
  setup-data:
    description: 'Command to prepare data on a clean checkout when data/train.csv is absent (e.g. dvc pull or python demo/train.py)'
    required: false
    default: 'python demo/train.py'
  fail-on-verdict:
    description: 'Fail the GitHub Actions workflow step if the verdict is FAIL'
    required: false
    default: 'true'

outputs:
  verdict:
    description: 'Overall quality gate verdict: pass, warn, or fail'
    value: ${{ steps.gate.outputs.verdict }}
  summary:
    description: 'Summary of check outcomes and key reasons'
    value: ${{ steps.gate.outputs.summary }}
  report-html:
    description: 'Path to the generated standalone HTML report'
    value: '${{ inputs.output-dir }}/report.html'
  pr-comment:
    description: 'Path to the generated Markdown PR comment'
    value: '${{ inputs.output-dir }}/pr_comment.md'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Fetch Base Ref & Install Pinned PredGate
      id: install_pinned
      shell: bash
      run: |
        set -euo pipefail
        BASE_REF="${{ inputs.base-ref || github.base_ref }}"
        EVENT_NAME="${{ github.event_name }}"
        PREDGATE_SPEC="${{ inputs.predgate-spec }}"

        if [ -z "$BASE_REF" ] && [[ "$EVENT_NAME" == pull_request* ]]; then
          echo "::error::Base ref is required on pull_request events; failing closed" >&2
          exit 1
        fi

        BASE_COMMIT=""
        if [ -n "$BASE_REF" ]; then
          git rev-parse --is-inside-work-tree >/dev/null 2>&1 || {
            echo "::error::Not inside a git work tree; cannot fetch base ref '${BASE_REF}'" >&2
            exit 1
          }
          # Fail closed if base ref cannot be fetched or verified (avoid --depth=1 which breaks three-dot merge-base diffs)
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          BASE_COMMIT=$(git rev-parse --verify "origin/${BASE_REF}^{commit}")
        fi

        python -m pip install --upgrade pip
        if [ -n "$PREDGATE_SPEC" ]; then
          pip install "${PREDGATE_SPEC}"
        elif [ -n "$BASE_COMMIT" ] && git cat-file -e "${BASE_COMMIT}:pyproject.toml" 2>/dev/null; then
          TRUSTED_DIR="${RUNNER_TEMP:-/tmp}/predgate-trusted-${GITHUB_RUN_ID:-local}"
          rm -rf "${TRUSTED_DIR}"
          mkdir -p "${TRUSTED_DIR}"
          git archive "${BASE_COMMIT}" | tar -x -C "${TRUSTED_DIR}"
          pip install "${TRUSTED_DIR}"
        elif [ -n "${GITHUB_ACTION_PATH:-}" ] && [ "${GITHUB_ACTION_PATH}" != "${GITHUB_WORKSPACE:-}" ] && [ -f "${GITHUB_ACTION_PATH}/pyproject.toml" ]; then
          pip install "${GITHUB_ACTION_PATH}"
        else
          echo "::error::Refusing to install untrusted PR head code. Provide 'predgate-spec', run from a pinned external action ref, or provide a base branch containing PredGate." >&2
          exit 1
        fi

        if [ -n "${GITHUB_OUTPUT:-}" ]; then
          echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "base_commit=${BASE_COMMIT}" >> "$GITHUB_OUTPUT"
        fi

    - name: Verify Champion Baseline, Prepare Data & Import Champion
      id: verify_champion
      shell: bash
      run: |
        set -euo pipefail
        BASE_REF="${{ steps.install_pinned.outputs.base_ref }}"
        BASE_DIR="${{ inputs.baseline-dir }}"
        DVC_FILE="${BASE_DIR}.dvc"
        PINNED_SHA="${{ inputs.pinned-sha256 }}"

        if [ -n "$BASE_REF" ]; then
          git rev-parse --verify "origin/${BASE_REF}" >/dev/null

          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Eq "^(${BASE_DIR}/|${DVC_FILE}$)"; then
            echo "::notice::PR modifies ${BASE_DIR}/; evaluating against trusted base-branch champion. Merge requires CODEOWNERS approval via branch protection."
          fi

          if [ -z "$PINNED_SHA" ]; then
            PINNED_SHA=$(git show "origin/${BASE_REF}:${DVC_FILE}" 2>/dev/null | python -c "import sys, yaml; d = yaml.safe_load(sys.stdin) or {}; print((d.get('outs') or [{}])[0].get('sha256', ''))" 2>/dev/null || true)
          fi
          if [ -z "$PINNED_SHA" ]; then
            PINNED_SHA=$(git show "origin/${BASE_REF}:${BASE_DIR}/metadata.json" 2>/dev/null | python -c "import sys, json; print(json.load(sys.stdin).get('model_sha256', ''))" 2>/dev/null || true)
          fi
          if [ -z "$PINNED_SHA" ]; then
            echo "::error::Could not determine pinned champion SHA-256 from origin/${BASE_REF}; failing closed" >&2
            exit 1
          fi

          git cat-file -e "origin/${BASE_REF}:${BASE_DIR}/model.pkl" 2>/dev/null || {
            echo "::error::Base ref origin/${BASE_REF} does not contain ${BASE_DIR}/model.pkl; failing closed" >&2
            exit 1
          }
          if git cat-file -e "origin/${BASE_REF}:${DVC_FILE}" 2>/dev/null; then
            git checkout "origin/${BASE_REF}" -- "${BASE_DIR}" "${DVC_FILE}"
          else
            git checkout "origin/${BASE_REF}" -- "${BASE_DIR}"
          fi
        fi

        if [ -f "${BASE_DIR}/model.pkl" ]; then
          VERIFY_ARGS=(--dir "${BASE_DIR}")
          if [ -f "${DVC_FILE}" ]; then
            VERIFY_ARGS+=(--dvc "${DVC_FILE}")
          fi
          if [ -n "$PINNED_SHA" ]; then
            VERIFY_ARGS+=(--pinned-sha256 "$PINNED_SHA")
          fi
          predgate baseline verify "${VERIFY_ARGS[@]}"
        elif [ -n "$BASE_REF" ]; then
          echo "::error::Champion baseline ${BASE_DIR}/model.pkl missing after base-branch checkout; failing closed" >&2
          exit 1
        fi

        if [ ! -f "data/train.csv" ]; then
          if [ -s ".dvc/config" ] && command -v dvc >/dev/null 2>&1; then
            dvc pull
          elif [ -n "${{ inputs.setup-data }}" ]; then
            ${{ inputs.setup-data }}
          fi
        fi

        if [ -f "${BASE_DIR}/model.pkl" ]; then
          IMPORT_ARGS=(--config "${{ inputs.config }}" --dir "${BASE_DIR}")
          if [ -n "$PINNED_SHA" ]; then
            IMPORT_ARGS+=(--pinned-sha256 "$PINNED_SHA")
          fi
          predgate baseline import "${IMPORT_ARGS[@]}"
        fi

        if [ -n "${GITHUB_OUTPUT:-}" ]; then
          echo "pinned_sha=${PINNED_SHA}" >> "$GITHUB_OUTPUT"
        fi

    - name: Run Quality Gate Checks
      id: gate
      shell: bash
      env:
        CHAMPION_PINNED_SHA256: ${{ steps.verify_champion.outputs.pinned_sha }}
      run: |
        mkdir -p "${{ inputs.output-dir }}"
        PR_NUM="${{ github.event.pull_request.number }}"
        BRANCH="${{ github.head_ref || github.ref_name }}"

        set +e
        if [ -n "$PR_NUM" ]; then
          predgate run --config "${{ inputs.config }}" --output "${{ inputs.output-dir }}" --branch "$BRANCH" --pr "$PR_NUM"
        else
          predgate run --config "${{ inputs.config }}" --output "${{ inputs.output-dir }}" --branch "$BRANCH"
        fi
        GATE_EXIT=$?
        set -e

        if [ -f "${{ inputs.output-dir }}/verdict.json" ]; then
          STATUS=$(python -c "import json; v = json.load(open('${{ inputs.output-dir }}/verdict.json')); print(v.get('status', 'fail'))")
          SUMMARY=$(python -c "import json; v = json.load(open('${{ inputs.output-dir }}/verdict.json')); print(v.get('summary', ''))")
        else
          STATUS="fail"
          SUMMARY="Quality gate execution failed (exit ${GATE_EXIT}) and did not produce verdict.json"
        fi

        if [ -n "${GITHUB_OUTPUT:-}" ]; then
          echo "verdict=$STATUS" >> "$GITHUB_OUTPUT"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
        fi

        if [ "${{ inputs.fail-on-verdict }}" = "true" ] && [ "$STATUS" = "fail" ]; then
          echo "::error::PredGate quality gate failed: $SUMMARY"
          exit 1
        fi
        exit 0
