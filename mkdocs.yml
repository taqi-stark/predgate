site_name: PredGate
site_description: CI/CD quality gate for machine learning models
repo_url: https://github.com/taqi-stark/predgate
repo_name: taqi-stark/predgate
docs_dir: docs
validation:
  links:
    not_found: info
    unrecognized_links: ignore

theme:
  name: material
  palette:
    - scheme: slate
      primary: blue
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - User Guide: usage.md
  - Statistical Power: power.md
  - Performance & Memory: performance.md
  - Benchmark Results: benchmark.md
  - Architecture: architecture.md
  - Decisions (ADRs): decisions.md
  - Releasing (OIDC): RELEASING.md
  - Release Notes (v0.1.0-alpha): RELEASE_NOTES_v0.1.0-alpha.md
