name: Bug Report
description: Report a bug or unexpected check verdict in PredGate
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear description of the bug or unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction steps
      description: Commands, predgate.yaml snippet, and sample data/model setup.
      placeholder: |
        1. predgate doctor --config predgate.yaml
        2. predgate run --config predgate.yaml
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `predgate doctor --json` and error logs
      render: shell
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "predgate 0.1.0a0, Python 3.12, Ubuntu 24.04"
    validations:
      required: true
