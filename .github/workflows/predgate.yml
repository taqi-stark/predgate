name: PredGate Quality Gate

on:
  pull_request:
    paths:
      - 'demo/**'
      - 'data/**'
      - 'champion/**'
      - 'champion.dvc'
      - 'predgate.yaml'
      - 'src/**'

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  predgate:
    name: Run PredGate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Fetch trusted base branch & install pinned PredGate
        id: trusted_setup
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            echo "::error::Missing github.base_ref; refusing to run without a verified base branch" >&2
            exit 1
          fi

          # Fail closed if the base ref cannot be fetched or resolved
          git fetch --no-tags --depth=1 origin "${BASE_REF}"
          BASE_COMMIT=$(git rev-parse --verify "origin/${BASE_REF}^{commit}")

          # Install PredGate from the trusted committed base branch, never from the untrusted PR head
          TRUSTED_DIR="${RUNNER_TEMP}/predgate-trusted"
          rm -rf "${TRUSTED_DIR}"
          mkdir -p "${TRUSTED_DIR}"
          git archive "${BASE_COMMIT}" | tar -x -C "${TRUSTED_DIR}"

          python -m pip install --upgrade pip
          pip install "${TRUSTED_DIR}"

          echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "base_commit=${BASE_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Verify champion baseline from base branch
        id: verify_champion
        run: |
          set -euo pipefail
          BASE_REF="${{ steps.trusted_setup.outputs.base_ref }}"

          # Surface notice if the PR modifies champion/; merge gating is enforced by GitHub branch protection + CODEOWNERS
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Eq '^(champion/|champion\.dvc$)'; then
            echo "::notice::PR modifies champion baseline; evaluating against trusted base-branch champion. Merge requires CODEOWNERS approval via branch protection."
          fi

          # Extract pinned SHA-256 from base branch champion.dvc (fallback: champion/metadata.json) and fail closed if missing
          PINNED_SHA=$(git show "origin/${BASE_REF}:champion.dvc" 2>/dev/null | python -c "import sys, yaml; d = yaml.safe_load(sys.stdin) or {}; print((d.get('outs') or [{}])[0].get('sha256', ''))" 2>/dev/null || true)
          if [ -z "$PINNED_SHA" ]; then
            PINNED_SHA=$(git show "origin/${BASE_REF}:champion/metadata.json" 2>/dev/null | python -c "import sys, json; print(json.load(sys.stdin).get('model_sha256', ''))" 2>/dev/null || true)
          fi
          if [ -z "$PINNED_SHA" ]; then
            echo "::error::Could not determine pinned champion SHA-256 from origin/${BASE_REF}; failing closed" >&2
            exit 1
          fi

          # Always load champion/ and champion.dvc from the trusted base branch (fail closed if missing)
          git checkout "origin/${BASE_REF}" -- champion champion.dvc

          # Verify SHA-256 against pinned base-branch value before any untrusted PR code runs
          predgate baseline verify \
            --dir champion \
            --dvc champion.dvc \
            --pinned-sha256 "$PINNED_SHA"

          echo "pinned_sha=${PINNED_SHA}" >> "$GITHUB_OUTPUT"

      - name: Generate demo data
        run: python demo/train.py

      - name: Import verified champion baseline into MLflow
        run: |
          set -euo pipefail
          predgate baseline import \
            --config predgate.yaml \
            --dir champion \
            --pinned-sha256 "${{ steps.verify_champion.outputs.pinned_sha }}"

      - name: Run PredGate
        id: gate
        env:
          CHAMPION_PINNED_SHA256: ${{ steps.verify_champion.outputs.pinned_sha }}
        run: |
          predgate run \
            --config predgate.yaml \
            --branch "${{ github.head_ref }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --output predgate_output
        continue-on-error: true

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: predgate-report
          path: predgate_output/report.html

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commentPath = 'predgate_output/pr_comment.md';
            if (!fs.existsSync(commentPath)) {
              console.log('No PR comment file found');
              return;
            }
            const body = fs.readFileSync(commentPath, 'utf8');
            const marker = '<!-- predgate-verdict -->';

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const existing = comments.find(c => c.body.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: `${marker}\n${body}`,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `${marker}\n${body}`,
                });
              }
            } catch (err) {
              core.warning(`Unable to post PR comment (expected on fork PRs with read-only token): ${err.message}`);
            }

      - name: Set commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const verdictPath = 'predgate_output/verdict.json';
            let state = 'failure';
            let description = 'Champion integrity check or PredGate execution failed';
            if (fs.existsSync(verdictPath)) {
              const verdict = JSON.parse(fs.readFileSync(verdictPath, 'utf8'));
              const stateMap = { pass: 'success', warn: 'success', fail: 'failure' };
              state = stateMap[verdict.status] || 'error';
              description = (verdict.summary || verdict.status).substring(0, 140);
            }

            try {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha,
                state,
                description,
                context: 'predgate',
              });
            } catch (err) {
              core.warning(`Unable to set commit status (expected on fork PRs with read-only token): ${err.message}`);
            }

      - name: Fail if verdict is FAIL
        if: steps.gate.outcome == 'failure'
        run: exit 1
