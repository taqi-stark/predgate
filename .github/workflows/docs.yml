name: Docs (MkDocs Material)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    name: Build MkDocs Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build docs site (strict)
        run: mkdocs build --strict

      - name: Upload built site artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: site/

  # GitHub Pages publishing is intentionally DISABLED by default.
  # To enable publishing later:
  #   1. Repository Settings -> Pages -> Source: GitHub Actions
  #   2. Change `if: false` below to `if: github.ref == 'refs/heads/main' && github.event_name == 'push'`
  #   3. Add `pages: write` and `id-token: write` under job permissions.
  deploy-pages:
    name: Deploy to GitHub Pages (disabled)
    needs: build-docs
    if: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: mkdocs-site
          path: site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
